<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pause Emails | Heart of Men</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/Images/favicon-64.png" />
  <link rel="apple-touch-icon" href="/Images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0e0c09;
      color: #e8dfc8;
      font-family: 'Playfair Display', Georgia, serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3.5rem 1.5rem;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.35;
      z-index: 1;
    }

    .bg-overlay {
      position: absolute;
      inset: 0;
      background: rgba(14, 12, 9, 0.68);
      z-index: 2;
    }

    .content { position: relative; z-index: 3; max-width: 680px; width: 100%; }

    .logo { width: 78px; height: 78px; margin: 0 auto 2.5rem; display: block; }

    .eyebrow {
      color: #b99b56;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.2rem, 5.5vw, 3.4rem);
      line-height: 1.15;
      color: #e8dfc8;
      margin-bottom: 1.5rem;
    }

    .sub {
      font-size: clamp(1.05rem, 2.2vw, 1.2rem);
      line-height: 1.75;
      color: #c9bfa8;
      margin-bottom: 2.5rem;
    }

    .pause-form { display: flex; max-width: 520px; margin: 0 auto; }

    .pause-form input {
      flex: 1;
      min-width: 0;
      padding: 1rem 1.25rem;
      background: #1a1510;
      border: 1px solid #2a2418;
      border-right: none;
      color: #f5f0e8;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 0.95rem;
      outline: none;
    }

    .pause-form input:focus { border-color: #b99b56; }

    .pause-form button {
      padding: 1rem 1.5rem;
      background: #b99b56;
      color: #0e0c09;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
      border: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .pause-form button:hover { background: #c9ad68; }
    .pause-form button:disabled { opacity: 0.6; cursor: default; }

    .form-error {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #b16f4a;
    }

    .success {
      max-width: 520px;
      margin: 0 auto;
      padding: 1.25rem 1.5rem;
      background: #1a1510;
      border: 1px solid #b99b56;
      color: #b99b56;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    @media (max-width: 520px) {
      .pause-form { flex-direction: column; }
      .pause-form input { border-right: 1px solid #2a2418; border-bottom: none; }
      .pause-form input:focus { border-color: #b99b56; }
    }
  </style>
</head>
<body>
  <img class="bg-img" src="/Images/roundhouseoutside.jpg" alt="" />
  <div class="bg-overlay"></div>
  <div class="content">
    <img class="logo" src="/Images/Transparent Logo.png" alt="Heart of Men" />
    <p class="eyebrow">Heart of Men</p>
    <h1>We have a big week of storytelling for Living Leadership.</h1>
    <p class="sub">If you know this isn&rsquo;t the time for you to join, let us know, and we&rsquo;ll pause all emails for you this week.</p>
    <div id="pause-form-wrap">
      <form class="pause-form" action="https://formspree.io/f/mnpqkajg" method="POST">
        <input type="hidden" name="_subject" value="Pause emails this week" />
        <input type="email" name="email" required placeholder="Your email address" aria-label="Your email address" />
        <button type="submit">Pause my emails</button>
      </form>
      <p class="form-error" id="pause-error" hidden>Something went wrong. Please try again.</p>
    </div>
    <p class="success" id="pause-success" hidden>Thank you for being a part of this ecosystem.</p>
  </div>
  <script>
    (function() {
      const wrap = document.getElementById('pause-form-wrap');
      const form = wrap.querySelector('form');
      const button = form.querySelector('button');
      const error = document.getElementById('pause-error');
      const success = document.getElementById('pause-success');
      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        button.disabled = true;
        error.hidden = true;
        try {
          const res = await fetch(form.action, { method: 'POST', body: new FormData(form), headers: { 'Accept': 'application/json' } });
          if (!res.ok) throw new Error('Request failed');
          wrap.hidden = true;
          success.hidden = false;
        } catch (err) {
          error.hidden = false;
          button.disabled = false;
        }
      });
    })();
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
