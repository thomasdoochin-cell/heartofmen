<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golden Repair</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Welcome to Golden Repair. You're in the right place." />
  <link rel="canonical" href="https://heartofmen.org/goldenrepair" />

  <meta property="og:title" content="Welcome to Golden Repair" />
  <meta property="og:description" content="You're in the right place." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://heartofmen.org/goldenrepair" />
  <meta property="og:image" content="https://heartofmen.org/Images/og-goldenrepair.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Welcome to Golden Repair" />
  <meta name="twitter:description" content="You're in the right place." />
  <meta name="twitter:image" content="https://heartofmen.org/Images/og-goldenrepair.jpg" />

  <link rel="icon" type="image/png" href="/Images/favicon-64.png" />
  <link rel="apple-touch-icon" href="/Images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* Palette matched to innatetraditions.com/rites-of-reunion */
    :root {
      --cream: #fff8f0;
      --sand: #d8b9a4;
      --red: #61321e;
      --terracotta: #a15d3c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--red) url('/Images/golden-repair.jpg') center / cover no-repeat fixed;
      color: var(--red);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 720px;
      width: 100%;
      padding: 3.5rem 2.5rem;
      text-align: center;
      background: rgba(255, 248, 240, 0.9);
      border: 1px solid var(--sand);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-family: 'Lora', Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.2rem, 6vw, 3.6rem);
      line-height: 1.15;
      color: var(--red);
    }

    .subhead {
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(1.15rem, 2.6vw, 1.45rem);
      color: var(--terracotta);
      margin-top: 0.9rem;
    }

    .rule {
      width: 64px;
      height: 1px;
      background: var(--sand);
      margin: 2.5rem auto;
    }

    .lead {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--red);
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: clamp(1rem, 5vw, 2.75rem);
      margin-top: 1.4rem;
    }

    .cd-unit { min-width: 4.5rem; }

    .cd-num {
      display: block;
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(2.8rem, 10vw, 4.5rem);
      line-height: 1;
      color: var(--terracotta);
      font-variant-numeric: tabular-nums;
    }

    .cd-label {
      display: block;
      margin-top: 0.6rem;
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--red);
      opacity: 0.75;
    }

    .begun {
      display: none;
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      color: var(--terracotta);
      margin-top: 1rem;
    }

    .holders {
      display: flex;
      justify-content: center;
      gap: clamp(1.5rem, 6vw, 3rem);
      margin-top: 2.75rem;
    }

    .holder img {
      display: block;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--sand);
      margin: 0 auto;
    }

    .holder-name {
      margin-top: 0.75rem;
      font-family: 'Lora', Georgia, serif;
      font-size: 1rem;
      color: var(--red);
    }

    .learn {
      margin-top: 3rem;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .learn a {
      color: var(--terracotta);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid var(--sand);
    }

    .learn a:hover { border-bottom-color: var(--terracotta); }

    @media (max-width: 600px) {
      body { padding: 2rem 1rem; background-attachment: scroll; }
      main { padding: 2.5rem 1.25rem; }
      .rule { margin: 2rem auto; }
      .cd-unit { min-width: 3.5rem; }
      .holder img { width: 96px; height: 96px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to Golden Repair</h1>
    <p class="subhead">You're in the right place.</p>

    <div class="rule"></div>

    <div id="cd-wrap">
      <p class="lead">Settle in, and we'll begin in:</p>
      <div class="countdown">
        <div class="cd-unit"><span class="cd-num" id="cd-h">00</span><span class="cd-label">Hours</span></div>
        <div class="cd-unit"><span class="cd-num" id="cd-m">00</span><span class="cd-label">Minutes</span></div>
        <div class="cd-unit"><span class="cd-num" id="cd-s">00</span><span class="cd-label">Seconds</span></div>
      </div>
    </div>
    <p class="begun" id="cd-begun">We're beginning.</p>

    <div class="holders">
      <div class="holder">
        <img src="/Images/gr-rachelle.jpg?v=2" alt="Rachelle Seliga" />
        <p class="holder-name">Rachelle Seliga</p>
      </div>
      <div class="holder">
        <img src="/Images/gr-thomas.jpg" alt="Thomas Andrew Doochin" />
        <p class="holder-name">Thomas Andrew Doochin</p>
      </div>
    </div>

    <p class="learn">To learn more about Rites of Reunion, visit <a href="https://ritesofreunion.com" target="_blank" rel="noopener">ritesofreunion.com</a></p>
  </main>

  <script>
    (function () {
      // Start time: 12:01pm ET. October is EDT (-04:00); EST months use -05:00.
      var TARGET = new Date('2026-10-02T12:01:00-04:00').getTime();
      var h = document.getElementById('cd-h');
      var m = document.getElementById('cd-m');
      var s = document.getElementById('cd-s');

      function pad(n) { return (n < 10 ? '0' : '') + n; }

      function tick() {
        var diff = Math.max(0, Math.floor((TARGET - Date.now()) / 1000));
        h.textContent = pad(Math.floor(diff / 3600));
        m.textContent = pad(Math.floor((diff % 3600) / 60));
        s.textContent = pad(diff % 60);
        if (diff === 0) {
          document.getElementById('cd-wrap').style.display = 'none';
          document.getElementById('cd-begun').style.display = 'block';
          clearInterval(timer);
        }
      }

      var timer = setInterval(tick, 1000);
      tick();
    })();
  </script>
</body>
</html>
