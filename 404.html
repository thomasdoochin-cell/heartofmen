<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Off the Trail | Living Leadership</title>
  <link rel="icon" type="image/png" href="/Images/favicon-64.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0e0c09;
      color: #e8dfc8;
      font-family: 'Playfair Display', Georgia, serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.35;
      z-index: 1;
    }

    .bg-overlay {
      position: absolute;
      inset: 0;
      background: rgba(14, 12, 9, 0.65);
      z-index: 2;
    }

    .content { position: relative; z-index: 3; max-width: 620px; }

    .logo { width: 78px; height: 78px; margin: 0 auto 2.5rem; display: block; }

    .eyebrow {
      color: #b99b56;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      line-height: 1.15;
      color: #e8dfc8;
      margin-bottom: 1.25rem;
    }

    p {
      font-size: clamp(1.05rem, 2.4vw, 1.25rem);
      line-height: 1.7;
      color: #c9bfa8;
      margin-bottom: 2.5rem;
    }

    .home-btn {
      display: inline-block;
      padding: 1rem 2rem;
      background: #b99b56;
      color: #0e0c09;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
      text-decoration: none;
    }

    .home-btn:hover { background: #c9ad68; }
  </style>
</head>
<body>
  <img class="bg-img" src="/Images/roundhouseoutside.jpg" alt="" />
  <div class="bg-overlay"></div>
  <div class="content">
    <img class="logo" src="/Images/Transparent Logo.png" alt="Heart of Men" />
    <p class="eyebrow">Heart of Men</p>
    <h1>Looks like you've wandered off the trail.</h1>
    <p>This page isn't here, brother — but the path back is right where you left it.</p>
    <a class="home-btn" href="/">Back to Living Leadership</a>
  </div>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
